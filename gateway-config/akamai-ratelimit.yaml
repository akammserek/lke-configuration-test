apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: akamai-route-ratelimit
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: akamai-route
  rateLimit:
    type: Local
    local:
      rules:
      - limit:
          requests: 1
          unit: Minute
